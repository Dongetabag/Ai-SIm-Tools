<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISim Tools - Complete AI Suite</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff7b7b 0%, #ff9a56 25%, #ffad56 50%, #ffb347 75%, #ff6b6b 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .liquid-glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .liquid-glass-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3collapse ease;
        }
        
        .liquid-glass-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .liquid-glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .liquid-glass-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
        }
        
        .instrument-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        
        .stem-icon {
            font-size: 1.25rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            }
            50% { 
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
            }
        }
        
        .tab-active {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
        }
        
        .tab-inactive {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .tab-inactive:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const instruments = [
            { id: 'vocals', name: 'Lead Vocals', icon: 'fas fa-microphone', description: 'Main vocals' },
            { id: 'drums', name: 'Drums', icon: 'fas fa-drum', description: 'Percussion' },
            { id: 'bass', name: 'Bass', icon: 'fas fa-guitar', description: 'Low frequencies' },
            { id: 'piano', name: 'Piano', icon: 'fas fa-music', description: 'From other stem' },
            { id: 'strings', name: 'Strings', icon: 'fas fa-violin', description: 'From other stem' },
            { id: 'keys', name: 'Keys', icon: 'fas fa-keyboard', description: 'From other stem' },
            { id: 'background', name: 'Background Vocals', icon: 'fas fa-users', description: 'From vocals stem' },
            { id: 'other', name: 'Other', icon: 'fas fa-compact-disc', description: 'Everything else' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('separator');
            
            // Stem Separator states
            const [selectedFile, setSelectedFile] = useState(null);
            const [selectedInstruments, setSelectedInstruments] = useState(['vocals', 'drums', 'bass', 'other']);
            const [currentJobId, setCurrentJobId] = useState(null);
            const [downloadData, setDownloadData] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [processingStatus, setProcessingStatus] = useState('');
            const [error, setError] = useState('');
            
            // YouTube states
            const [youtubeUrl, setYoutubeUrl] = useState('');
            const [youtubeJobId, setYoutubeJobId] = useState(null);
            const [youtubeStatus, setYoutubeStatus] = useState('');
            const [youtubeError, setYoutubeError] = useState('');
            
            // PDF states
            const [pdfFiles, setPdfFiles] = useState([]);
            const [pdfJobId, setPdfJobId] = useState(null);
            const [pdfStatus, setPdfStatus] = useState('');
            const [pdfError, setPdfError] = useState('');
            const [pdfOperation, setPdfOperation] = useState('merge');

            // Image states
            const [selectedImage, setSelectedImage] = useState(null);
            const [scaleFactor, setScaleFactor] = useState(2.0);
            const [imageJobId, setImageJobId] = useState(null);
            const [imageStatus, setImageStatus] = useState('');
            const [imageError, setImageError] = useState('');
            const [imageFilename, setImageFilename] = useState('');

            // Video states
            const [videoPrompt, setVideoPrompt] = useState('');
            const [videoDuration, setVideoDuration] = useState(5);
            const [videoWidth, setVideoWidth] = useState(512);
            const [videoHeight, setVideoHeight] = useState(512);
            const [videoJobId, setVideoJobId] = useState(null);
            const [videoStatus, setVideoStatus] = useState('');
            const [videoError, setVideoError] = useState('');
            const [videoFilename, setVideoFilename] = useState('');

            const toggleInstrument = (instrumentId) => {
                setSelectedInstruments(prev => 
                    prev.includes(instrumentId) 
                        ? prev.filter(id => id !== instrumentId)
                        : [...prev, instrumentId]
                );
            };

            const handleFileSelect = (event) => {
                const file = event.target.files[0];
                if (file) {
                    setSelectedFile(file);
                    setError('');
                }
            };

            const handlePdfFilesSelect = (event) => {
                const files = Array.from(event.target.files);
                setPdfFiles(files);
                setPdfError('');
            };

            const handleImageSelect = (event) => {
                const file = event.target.files[0];
                if (file) {
                    setSelectedImage(file);
                    setImageError('');
                }
            };

            const separate_audio = async () => {
                if (!selectedFile) {
                    setError('Please select a file');
                    return;
                }

                setIsProcessing(true);
                setProcessingStatus('Uploading file...');
                setError('');

                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('instruments', selectedInstruments.join(','));

                try {
                    const response = await fetch('http://localhost:8000/api/separate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setCurrentJobId(result.job_id);
                    setProcessingStatus('Processing audio... This may take a few minutes.');
                    
                    pollStatus(result.job_id);
                } catch (err) {
                    setError(`Processing failed: ${err.message}`);
                    setIsProcessing(false);
                    setProcessingStatus('');
                }
            };

            const pollStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setDownloadData(status.stems);
                            setIsProcessing(false);
                            setProcessingStatus('');
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setError(`Processing failed: ${status.error}`);
                            setIsProcessing(false);
                            setProcessingStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setError(`Failed to check status: ${err.message}`);
                        setIsProcessing(false);
                        setProcessingStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const convert_youtube = async () => {
                if (!youtubeUrl.trim()) {
                    setYoutubeError('Please enter a YouTube URL');
                    return;
                }

                setYoutubeStatus('Converting YouTube video...');
                setYoutubeError('');

                try {
                    const response = await fetch('http://localhost:8000/api/youtube/convert', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: youtubeUrl })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setYoutubeJobId(result.job_id);
                    setYoutubeStatus('Converting... This may take a few minutes.');
                    
                    pollYoutubeStatus(result.job_id);
                } catch (err) {
                    setYoutubeError(`Conversion failed: ${err.message}`);
                    setYoutubeStatus('');
                }
            };

            const pollYoutubeStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setYoutubeStatus('Conversion completed!');
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setYoutubeError(`Conversion failed: ${status.error}`);
                            setYoutubeStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setYoutubeError(`Failed to check conversion status: ${err.message}`);
                        setYoutubeStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const process_pdf = async () => {
                if (pdfFiles.length === 0) {
                    setPdfError('Please select PDF files');
                    return;
                }

                setPdfStatus('Processing PDFs...');
                setPdfError('');

                const formData = new FormData();
                pdfFiles.forEach(file => formData.append('files', file));

                try {
                    let endpoint = 'http://localhost:8000/api/pdf/merge';
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setPdfJobId(result.job_id);
                    setPdfStatus('Processing... This may take a few minutes.');
                    
                    pollPdfStatus(result.job_id);
                } catch (err) {
                    setPdfError(`Processing failed: ${err.message}`);
                    setPdfStatus('');
                }
            };

            const pollPdfStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setPdfStatus('Processing completed!');
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setPdfError(`Processing failed: ${status.error}`);
                            setPdfStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setPdfError(`Failed to check processing status: ${err.message}`);
                        setPdfStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const enhance_image = async () => {
                if (!selectedImage) {
                    setImageError('Please select an image');
                    return;
                }

                setImageStatus('Enhancing image...');
                setImageError('');

                const formData = new FormData();
                formData.append('file', selectedImage);
                formData.append('scale_factor', scaleFactor.toString());

                try {
                    const response = await fetch('http://localhost:8000/api/image/enhance', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! statusurl: ${response.status}`);
                    }

                    const result = await response.json();
                    setImageJobId(result.job_id);
                    setImageStatus('Enhancing... This may take a few minutes.');
                    
                    pollImageStatus(result.job_id);
                } catch (err) {
                    setImageError(`Enhancement failed: ${err.message}`);
                    setImageStatus('');
                }
            };

            const pollImageStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setImageStatus('Enhancement completed!');
                            setImageFilename(status.filename);
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setImageError(`Enhancement failed: ${status.error}`);
                            setImageStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setImageError(`Failed to check enhancement status: ${err.message}`);
                        setImageStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const generate_video = async () => {
                if (!videoPrompt.trim()) {
                    setVideoError('Please enter a video prompt');
                    return;
                }

                setVideoStatus('Generating video...');
                setVideoError('');

                const formData = new FormData();
                formData.append('prompt', videoPrompt);
                formData.append('duration', videoDuration.toString());
                formData.append('width', videoWidth.toString());
                formData.append('height', videoHeight.toString());

                try {
                    const response = await fetch('http://localhost:8000/api/video/generate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setVideoJobId(result.job_id);
                    setVideoStatus('Generating... This may take a few minutes.');
                    
                    pollVideoStatus(result.job_id);
                } catch (err) {
                    setVideoError(`Generation failed: ${err.message}`);
                    setVideoStatus('');
                }
            };

            const pollVideoStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setVideoStatus('Generation completed!');
                            setVideoFilename(status.filename);
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setVideoError(`Generation failed: ${status.error}`);
                            setVideoStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setVideoError(`Failed to check generation status: ${err.message}`);
                        setVideoStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-12">
                            <div className="liquid-glass-card rounded-3xl p-8 mb-6">
                                <i className="fas fa-magic text-6xl text-white floating pulse-glow mb-6"></i>
                                <h1 className="text-4xl font-semibold text-white mb-2">
                                    AISim Tools
                                </h1>
                                <p className="text-white/80 text-lg">
                                    Complete AI-powered toolkit: audio separation, YouTube conversion, PDF processing, image enhancement, and video generation
                                </p>
                            </div>
                        </div>

                        {/* Tab Navigation */}
                        <div className="liquid-glass-card rounded-3xl p-2 mb-8">
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-2">
                                <button
                                    onClick={() => setActiveTab('separator')}
                                    className={`py-3 px-4 rounded-2xl font-semibold text-white transition-all duration-300 text-sm ${
                                        activeTab === 'separator' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-waveform-lines mr-2"></i>
                                    Audio
                                </button>
                                <button
                                    onClick={() => setActiveTab('youtube')}
                                    className={`py-3 px-4 rounded-2xl font-semibold text-white transition-all duration-300 text-sm ${
                                        activeTab === 'youtube' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fab fa-youtube mr-2"></i>
                                    YouTube
                                </button>
                                <button
                                    onClick={() => setActiveTab('pdf')}
                                    className={`py-3 px-4 rounded-2xl font-semibold text-white transition-all duration-300 text-sm ${
                                        activeTab === 'pdf' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-file-pdf mr-2"></i>
                                    PDF
                                </button>
                                <button
                                    onClick={() => setActiveTab('image')}
                                    className={`py-3 px-4 rounded-2xl font-semibold text-white transition-all duration-300 text-sm ${
                                        activeTab === 'image' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-image mr-2"></i>
                                    Image
                                </button>
                                <button
                                    onClick={() => setActiveTab('video')}
                                    className={`py-3 px-4 rounded-2xl font-semibold text-white transition-all duration-300 text-sm ${
                                        activeTab === 'video' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-video mr-2"></i>
                                    Video
                                </button>
                            </div>
                        </div>

                        {/* Tab Content */}
                        {activeTab === 'separator' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-waveform-lines mr-3"></i>
                                    AI Stem Separator
                                </h2>
                                
                                {/* File Upload */}
                                <div className="mb-8">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-upload mr-2"></i>
                                        Upload Audio File
                                    </label>
                                    <input
                                        type="file"
                                        onChange={handleFileSelect}
                                        accept="audio/*"
                                        className="w-full p-4 liquid-glass-input rounded-xl"
                                    />
                                    {selectedFile && (
                                        <div className="mt-2 text-white/80">
                                            <i className="fas fa-check-circle mr-2 text-green-400"></i>
                                            Selected: {selectedFile.name}
                                        </div>
                                    )}
                                </div>

                                {/* Instrument Selection */}
                                <div className="mb-8">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-sliders-h mr-2"></i>
                                        Select Instruments to Separate
                                    </label>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        {instruments.map(instrument => (
                                            <button
                                                key={instrument.id}
                                                onClick={() => toggleInstrument(instrument.id)}
                                                className={`liquid-glass-card p-4 rounded-xl text-center transition-all duration-200 
                                                    ${
                                                        selectedInstruments.includes(instrument.id) 
                                                            ? 'ring-2 ring-white/50 bg-white/20' 
                                                            : ''
                                                    }`}
                                            >
                                                <i className={`${instrument.icon} instrument-icon text-white block mx-auto mb-2`}></i>
                                                <div className="text-white text-sm font-medium">{instrument.name}</div>
                                                <div className="text-white/60 text-xs">{instrument.description}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Process Button */}
                                <div className="mb-8">
                                    <button
                                        onClick={separate_audio}
                                        disabled={isProcessing || !selectedFile}
                                        className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isProcessing ? (
                                            <>
                                                <i className="fas fa-spinner fa-spin mr-3"></i>
                                                {processingStatus}
                                            </>
                                        ) : (
                                            <>
                                                <i className="fas fa-magic mr-3"></i>
                                                Separate Audio
                                            </>
                                        )}
                                    </button>
                                </div>

                                {/* Error Display */}
                                {error && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{error}</p>
                                    </div>
                                )}

                                {/* Download Section */}
                                {downloadData && (
                                    <div className="space-y-4">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Separated Stems
                                        </h3>
                                        <div className="grid gap-4">
                                            {Object.entries(downloadData).map(([stemName, stemInfo]) => (
                                                <div key={stemName} className="liquid-glass-card p-6 rounded-xl">
                                                    <div className="flex items-center justify-between mb-4">
                                                        <div className="flex items-center">
                                                            <i className={`${instruments.find(i => i.id === stemName)?.icon || 'fas fa-music'} stem-icon text-white mr-3`}></i>
                                                            <h3 className="text-white font-semibold">
                                                                {instruments.find(i => i.id === stemName)?.name || stemName.charAt(0).toUpperCase() + stemName.slice(1)}
                                                            </h3>
                                                        </div>
                                                        <span className="text-white/70 text-sm bg-white/20 rounded-full px-3 py-1">
                                                            {(stemInfo.size / 1024 / 1024).toFixed(2)} MB
                                                        </span>
                                                    </div>
                                                    <a 
                                                        href={`http://localhost:8000/api/download/${currentJobId}/${stemName}`} 
                                                        download={`${selectedFile.name.replace(/\.[^/.]+$/, '')}_${stemName}.wav`}
                                                        className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                                    >
                                                        <i className="fas fa-download mr-2"></i> Download
                                                    </a>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'youtube' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fab fa-youtube mr-3"></i>
                                    YouTube to WAV Converter
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-link mr-2"></i>
                                        YouTube URL
                                    </label>
                                    <input
                                        type="url"
                                        value={youtubeUrl}
                                        onChange={(e) => setYoutubeUrl(e.target.value)}
                                        placeholder="https://www.youtube.com/watch?v=..."
                                        className="w-full p-4 liquid-glass-input rounded-xl"
                                    />
                                </div>

                                <button
                                    onClick={convert_youtube}
                                    disabled={!youtubeUrl.trim() || youtubeStatus.includes('Converting')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {youtubeStatus.includes('Converting') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {youtubeStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fab fa-youtube mr-3"></i>
                                            Convert to WAV
                                        </>
                                    )}
                                </button>

                                {youtubeError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{youtubeError}</p>
                                    </div>
                                )}

                                {youtubeStatus.includes('completed') && youtubeJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Converted Audio
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/youtube/download/${youtubeJobId}`} 
                                            download
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download WAV
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'pdf' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-file-pdf mr-3"></i>
                                    PDF Processing Tools
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-upload mr-2"></i>
                                        Upload PDF Files to Merge
                                    </label>
                                    <input
                                        type="file"
                                        onChange={handlePdfFilesSelect}
                                        accept="application/pdf"
                                        multiple
                                        className="w-full p-4 liquid-glass-input rounded-xl"
                                    />
                                    {pdfFiles.length > 0 && (
                                        <div className="mt-2 text-white/80">
                                            <i className="fas fa-check-circle mr-2 text-green-400"></i>
                                            Selected: {pdfFiles.length} file(s)
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={process_pdf}
                                    disabled={pdfFiles.length === 0 || pdfStatus.includes('Processing')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {pdfStatus.includes('Processing') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {pdfStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-file-pdf mr-3"></i>
                                            Merge PDFs
                                        </>
                                    )}
                                </button>

                                {pdfError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{pdfError}</p>
                                    </div>
                                )}

                                {pdfStatus.includes('completed') && pdfJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Merged PDF
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/pdf/download/${pdfJobId}`} 
                                            download
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download PDF
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'image' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-image mr-3"></i>
                                    AI Image Enhancer
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-upload mr-2"></i>
                                        Upload Image
                                    </label>
                                    <input
                                        type="file"
                                        onChange={handleImageSelect}
                                        accept="image/*"
                                        className="w-full p-4 liquid-glass-input rounded-xl"
                                    />
                                    {selectedImage && (
                                        <div className="mt-2 text-white/80">
                                            <i className="fas fa-check-circle mr-2 text-green-400"></i>
                                            Selected: {selectedImage.name}
                                        </div>
                                    )}
                                </div>

                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-expand-arrows-alt mr-2"></i>
                                        Scale Factor
                                    </label>
                                    <input
                                        type="range"
                                        min="1"
                                        max="4"
                                        step="0.5"
                                        value={scaleFactor}
                                        onChange={(e) => setScaleFactor(parseFloat(e.target.value))}
                                        className="w-full h-2 bg-white/20 rounded-lg appearance-none cursor-pointer"
                                    />
                                    <div className="flex justify-between text-white/70 text-sm mt-2">
                                        <span>1x</span>
                                        <span className="font-medium">{scaleFactor}x</span>
                                        <span>4x</span>
                                    </div>
                                </div>

                                <button
                                    onClick={enhance_image}
                                    disabled={!selectedImage || imageStatus.includes('Enhancing')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {imageStatus.includes('Enhancing') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {imageStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-magic mr-3"></i>
                                            Enhance Image
                                        </>
                                    )}
                                </button>

                                {imageError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{imageError}</p>
                                    </div>
                                )}

                                {imageStatus.includes('completed') && imageJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Enhanced Image
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/image/download/${imageJobId}`} 
                                            download={imageFilename}
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download Image
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'video' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-video mr-3"></i>
                                    AI Video Generator
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-font mr-2"></i>
                                        Video Prompt
                                    </label>
                                    <textarea
                                        value={videoPrompt}
                                        onChange={(e) => setVideoPrompt(e.target.value)}
                                        placeholder="Describe the video you want to generate..."
                                        className="w-full p-4 liquid-glass-input rounded-xl h-32 resize-none"
                                    />
                                </div>

                                <div className="grid md:grid-cols-3 gap-6 mb-6">
                                    <div>
                                        <label className="block text-white font-medium mb-4">
                                            <i className="fas fa-clock mr-2"></i>
                                            Duration (seconds)
                                        </label>
                                        <input
                                            type="number"
                                            min="1"
                                            max="30"
                                            value={videoDuration}
                                            onChange={(e) => setVideoDuration(parseInt(e.target.value))}
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-white font-medium mb-4">
                                            <i className="fas fa-expand-arrows-alt mr-2"></i>
                                            Width
                                        </label>
                                        <select
                                            value={videoWidth}
                                            onChange={(e) => setVideoWidth(parseInt(e.target.value))}
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        >
                                            <option value={256} className="bg-gray-800 text-white">256px</option>
                                            <option value={512} className="bg-gray-800 text-white">512px</option>
                                            <option value={768} className="bg-gray-800 text-white">768px</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-white font-medium mb-4">
                                            <i className="fas fa-expand-arrows-alt mr-2"></i>
                                            Height
                                        </label>
                                        <select
                                            value={videoHeight}
                                            onChange={(e) => setVideoHeight(parseInt(e.target.value))}
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        >
                                            <option value={256} className="bg-gray-800 text-white">256px</option>
                                            <option value={512} className="bg-gray-800 text-white">512px</option>
                                            <option value={768} className="bg-gray-800 text-white">768px</option>
                                        </select>
                                    </div>
                                </div>

                                <button
                                    onClick={generate_video}
                                    disabled={!videoPrompt.trim() || videoStatus.includes('Generating')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {videoStatus.includes('Generating') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {videoStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-video mr-3"></i>
                                            Generate Video
                                        </>
                                    )}
                                </button>

                                {videoError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{videoError}</p>
                                    </div>
                                )}

                                {videoStatus.includes('completed') && videoJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Generated Video
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/video/download/${videoJobId}`} 
                                            download={videoFilename}
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download Video
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
