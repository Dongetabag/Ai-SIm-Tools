<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stem Separator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunset: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .sunset-gradient {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 25%, #48dbfb 50%, #ff9ff3 75%, #54a0ff 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        .sunset-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .sunset-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .glow {
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }
        
        .sunset-button {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            transition: all 0.3s ease;
        }
        
        .sunset-button:hover {
            background: linear-gradient(45deg, #feca57, #ff6b6b);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }
    </style>
</head>
<body class="sunset-gradient min-h-screen">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useCallback } = React;
        const { Upload, Music, Download, Loader2, CheckCircle, AlertCircle } = lucide;

        const StemSeparator = () => {
            const [file, setFile] = useState(null);
            const [model, setModel] = useState('htdemucs');
            const [jobId, setJobId] = useState(null);
            const [status, setStatus] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [dragActive, setDragActive] = useState(false);

            const models = [
                { value: 'htdemucs', label: 'HTDemucs (Recommended)', description: 'Fast, good quality' },
                { value: 'htdemucs_ft', label: 'HTDemucs Fine-tuned', description: 'Fine-tuned version' },
                { value: 'mdx_extra', label: 'MDX Extra', description: 'Best quality (slower)' },
                { value: 'mdx_extra_q', label: 'MDX Extra Q', description: 'Fast processing' }
            ];

            const handleDrag = useCallback((e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.type === "dragenter" || e.type === "dragover") {
                    setDragActive(true);
                } else if (e.type === "dragleave") {
                    setDragActive(false);
                }
            }, []);

            const handleDrop = useCallback((e) => {
                e.preventDefault();
                e.stopPropagation();
                setDragActive(false);
                
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    const droppedFile = e.dataTransfer.files[0];
                    if (droppedFile.type.startsWith('audio/') || 
                        droppedFile.name.endsWith('.mp3') || 
                        droppedFile.name.endsWith('.wav') || 
                        droppedFile.name.endsWith('.flac')) {
                        setFile(droppedFile);
                    } else {
                        alert('Please upload an audio file (MP3, WAV, FLAC)');
                    }
                }
            }, []);

            const handleFileChange = (e) => {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    setFile(selectedFile);
                }
            };

            const uploadAndSeparate = async () => {
                if (!file) {
                    alert('Please select an audio file first');
                    return;
                }

                setIsUploading(true);
                setStatus({ type: 'uploading', message: 'Uploading file...' });

                try {
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('model', model);

                    const response = await fetch('/api/separate', {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setJobId(result.job_id);
                    setStatus({ type: 'processing', message: 'Processing audio...' });
                    
                    // Start polling for status
                    pollStatus(result.job_id);
                    
                } catch (error) {
                    console.error('Upload error:', error);
                    setStatus({ type: 'error', message: `Upload failed: ${error.message}` });
                } finally {
                    setIsUploading(false);
                }
            };

            const pollStatus = async (jobId) => {
                const poll = async () => {
                    try {
                        const response = await fetch(`/api/status/${jobId}`);
                        const data = await response.json();
                        
                        if (data.status === 'completed') {
                            setStatus({ type: 'completed', message: 'Separation completed!', stems: data.stems });
                        } else if (data.status === 'failed') {
                            setStatus({ type: 'error', message: `Processing failed: ${data.error}` });
                        } else if (data.status === 'processing') {
                            setStatus({ type: 'processing', message: 'Processing audio...' });
                            setTimeout(poll, 2000); // Poll every 2 seconds
                        }
                    } catch (error) {
                        console.error('Status check error:', error);
                        setStatus({ type: 'error', message: 'Failed to check status' });
                    }
                };
                
                poll();
            };

            const downloadStem = async (stemName) => {
                if (!jobId) return;
                
                try {
                    const response = await fetch(`/api/download/${jobId}/${stemName}`);
                    if (!response.ok) throw new Error('Download failed');
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${file?.name.replace(/\.[^/.]+$/, '')}_${stemName}.wav`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } catch (error) {
                    console.error('Download error:', error);
                    alert('Download failed');
                }
            };

            const reset = () => {
                setFile(null);
                setJobId(null);
                setStatus(null);
                setModel('htdemucs');
            };

            return React.createElement('div', { className: 'min-h-screen p-6 flex items-center justify-center' },
                React.createElement('div', { className: 'max-w-4xl w-full' },
                    React.createElement('div', { className: 'sunset-card rounded-3xl p-8 shadow-2xl' },
                        React.createElement('div', { className: 'text-center mb-8' },
                            React.createElement(Music, { className: 'w-20 h-20 mx-auto mb-6 text-white floating glow' }),
                            React.createElement('h1', { className: 'text-5xl font-bold bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 bg-clip-text text-transparent mb-4' }, '🎵 AI Stem Separator'),
                            React.createElement('p', { className: 'text-xl text-gray-700 font-medium' }, 'Separate vocals, drums, bass, and other instruments using AI'),
                            React.createElement('div', { className: 'mt-4 flex justify-center space-x-2' },
                                React.createElement('div', { className: 'w-3 h-3 bg-pink-400 rounded-full animate-pulse' }),
                                React.createElement('div', { className: 'w-3 h-3 bg-yellow-400 rounded-full animate-pulse', style: { animationDelay: '0.2s' } }),
                                React.createElement('div', { className: 'w-3 h-3 bg-blue-400 rounded-full animate-pulse', style: { animationDelay: '0.4s' } }),
                                React.createElement('div', { className: 'w-3 h-3 bg-purple-400 rounded-full animate-pulse', style: { animationDelay: '0.6s' } })
                            )
                        ),
                
                !status && React.createElement('div', { className: 'space-y-8' },
                    // File Upload
                    React.createElement('div', {
                        className: `relative border-2 border-dashed rounded-2xl p-12 text-center transition-all duration-300 ${
                            dragActive 
                                ? 'border-pink-400 bg-gradient-to-br from-pink-50 to-yellow-50 scale-105' 
                                : file 
                                    ? 'border-green-400 bg-gradient-to-br from-green-50 to-blue-50' 
                                    : 'border-white/30 hover:border-white/50 sunset-glass hover:scale-102'
                        }`,
                        onDragEnter: handleDrag,
                        onDragLeave: handleDrag,
                        onDragOver: handleDrag,
                        onDrop: handleDrop
                    },
                        React.createElement('input', {
                            type: 'file',
                            accept: 'audio/*,.mp3,.wav,.flac',
                            onChange: handleFileChange,
                            className: 'absolute inset-0 w-full h-full opacity-0 cursor-pointer'
                        }),
                        
                        file ? React.createElement('div', { className: 'space-y-4' },
                            React.createElement(CheckCircle, { className: 'w-16 h-16 mx-auto text-green-500 floating' }),
                            React.createElement('p', { className: 'text-xl font-bold text-green-700' }, file.name),
                            React.createElement('p', { className: 'text-sm text-gray-600 bg-white/50 rounded-full px-4 py-2 inline-block' },
                                `${(file.size / 1024 / 1024).toFixed(2)} MB`
                            ),
                            React.createElement('button', {
                                onClick: () => setFile(null),
                                className: 'text-sm text-red-600 hover:text-red-800 bg-white/30 rounded-full px-4 py-2 transition-all hover:bg-white/50'
                            }, 'Remove file')
                        ) : React.createElement('div', { className: 'space-y-4' },
                            React.createElement(Upload, { className: 'w-16 h-16 mx-auto text-white/80 floating' }),
                            React.createElement('p', { className: 'text-2xl font-bold text-white' },
                                'Drop your audio file here or click to browse'
                            ),
                            React.createElement('p', { className: 'text-lg text-white/80' },
                                'Supports MP3, WAV, FLAC (max 100MB)'
                            ),
                            React.createElement('div', { className: 'flex justify-center space-x-2 mt-4' },
                                React.createElement('span', { className: 'bg-white/20 rounded-full px-3 py-1 text-sm text-white' }, '🎵 Music'),
                                React.createElement('span', { className: 'bg-white/20 rounded-full px-3 py-1 text-sm text-white' }, '🎤 Vocals'),
                                React.createElement('span', { className: 'bg-white/20 rounded-full px-3 py-1 text-sm text-white' }, '🥁 Drums')
                            )
                        )
                    ),

                    // Model Selection
                    React.createElement('div', { className: 'space-y-4' },
                        React.createElement('label', { className: 'block text-xl font-bold text-white text-center' },
                            '🤖 Choose AI Model'
                        ),
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                            models.map((modelOption) => 
                                React.createElement('label', {
                                    key: modelOption.value,
                                    className: `relative flex items-start p-6 border-2 rounded-2xl cursor-pointer transition-all duration-300 ${
                                        model === modelOption.value
                                            ? 'border-pink-400 bg-gradient-to-br from-pink-100 to-yellow-100 scale-105 shadow-lg'
                                            : 'border-white/30 hover:border-white/50 sunset-glass hover:scale-102'
                                    }`
                                },
                                    React.createElement('input', {
                                        type: 'radio',
                                        name: 'model',
                                        value: modelOption.value,
                                        checked: model === modelOption.value,
                                        onChange: (e) => setModel(e.target.value),
                                        className: 'sr-only'
                                    }),
                                    React.createElement('div', { className: 'flex-1' },
                                        React.createElement('div', { className: `font-bold text-lg ${model === modelOption.value ? 'text-gray-800' : 'text-white'}` },
                                            modelOption.label
                                        ),
                                        React.createElement('div', { className: `text-sm ${model === modelOption.value ? 'text-gray-600' : 'text-white/80'}` },
                                            modelOption.description
                                        )
                                    )
                                )
                            )
                        )
                    ),

                    // Upload Button
                    React.createElement('button', {
                        onClick: uploadAndSeparate,
                        disabled: !file || isUploading,
                        className: `w-full py-6 px-8 rounded-2xl font-bold text-xl text-white transition-all duration-300 flex items-center justify-center space-x-3 ${
                            !file || isUploading 
                                ? 'bg-gray-400 cursor-not-allowed' 
                                : 'sunset-button glow'
                        }`
                    },
                        isUploading ? [
                            React.createElement(Loader2, { key: 'loader', className: 'w-5 h-5 animate-spin' }),
                            React.createElement('span', { key: 'text' }, 'Uploading...')
                        ] : [
                            React.createElement(Upload, { key: 'upload', className: 'w-5 h-5' }),
                            React.createElement('span', { key: 'text' }, 'Start Separation')
                        ]
                    )
                ),

                // Status Display
                status && React.createElement('div', { className: 'space-y-8' },
                    React.createElement('div', {
                        className: `p-8 rounded-2xl border-2 ${
                            status.type === 'error' 
                                ? 'bg-gradient-to-br from-red-50 to-pink-50 border-red-300' 
                                : status.type === 'completed'
                                    ? 'bg-gradient-to-br from-green-50 to-blue-50 border-green-300'
                                    : 'bg-gradient-to-br from-blue-50 to-purple-50 border-blue-300'
                        }`
                    },
                        React.createElement('div', { className: 'flex items-center space-x-4' },
                            status.type === 'error' ? React.createElement(AlertCircle, { className: 'w-12 h-12 text-red-500 floating' }) :
                            status.type === 'completed' ? React.createElement(CheckCircle, { className: 'w-12 h-12 text-green-500 floating' }) :
                            React.createElement(Loader2, { className: 'w-12 h-12 text-blue-500 animate-spin' }),
                            React.createElement('div', {},
                                React.createElement('p', {
                                    className: `text-xl font-bold ${
                                        status.type === 'error' 
                                            ? 'text-red-700' 
                                            : status.type === 'completed'
                                                ? 'text-green-700'
                                                : 'text-blue-700'
                                    }`
                                }, status.message),
                                status.type === 'processing' && React.createElement('p', {
                                    className: 'text-lg text-blue-600 mt-2'
                                }, 'This may take a few minutes...')
                            )
                        )
                    ),

                    // Download Stems
                    status.type === 'completed' && status.stems && React.createElement('div', { className: 'space-y-6' },
                        React.createElement('h3', { className: 'text-2xl font-bold text-white text-center' },
                            '🎵 Download Separated Stems'
                        ),
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6' },
                            Object.entries(status.stems).map(([stemName, stemInfo]) =>
                                React.createElement('div', {
                                    key: stemName,
                                    className: 'sunset-glass p-6 rounded-2xl hover:scale-105 transition-all duration-300'
                                },
                                    React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                                        React.createElement('h4', { className: 'font-bold text-lg text-white capitalize' },
                                            stemName === 'other' ? '🎼 Other' : 
                                            stemName === 'vocals' ? '🎤 Vocals' :
                                            stemName === 'drums' ? '🥁 Drums' :
                                            stemName === 'bass' ? '🎸 Bass' : stemName
                                        ),
                                        React.createElement('span', { className: 'text-sm text-white/80 bg-white/20 rounded-full px-3 py-1' },
                                            `${(stemInfo.size / 1024 / 1024).toFixed(2)} MB`
                                        )
                                    ),
                                    React.createElement('button', {
                                        onClick: () => downloadStem(stemName),
                                        className: 'w-full sunset-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center space-x-2'
                                    },
                                        React.createElement(Download, { className: 'w-5 h-5' }),
                                        React.createElement('span', {}, 'Download')
                                    )
                                )
                            )
                        )
                    ),

                    // Reset Button
                    React.createElement('div', { className: 'text-center' },
                        React.createElement('button', {
                            onClick: reset,
                            className: 'sunset-glass text-white py-4 px-8 rounded-2xl font-bold text-lg hover:scale-105 transition-all duration-300'
                        }, '🔄 Process Another File')
                    )
                        )
                    )
                )
            );
        };

        ReactDOM.render(React.createElement(StemSeparator), document.getElementById('root'));
    </script>
</body>
</html>
