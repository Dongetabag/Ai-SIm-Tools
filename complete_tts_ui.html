<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISim Tools - Professional</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff7b7b 0%, #ff9a56 25%, #ffad56 50%, #ffb347 75%, #ff6b6b 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .liquid-glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .liquid-glass-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .liquid-glass-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .liquid-glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .liquid-glass-input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            outline: none;
        }
        
        .instrument-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        
        .stem-icon {
            font-size: 1.25rem;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            }
            50% { 
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
            }
        }
        
        .tab-active {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
        }
        
        .tab-inactive {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .tab-inactive:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        const instruments = [
            { id: 'vocals', name: 'Lead Vocals', icon: 'fas fa-microphone', description: 'Main vocals' },
            { id: 'drums', name: 'Drums', icon: 'fas fa-drum', description: 'Percussion' },
            { id: 'bass', name: 'Bass', icon: 'fas fa-guitar', description: 'Low frequencies' },
            { id: 'piano', name: 'Piano', icon: 'fas fa-music', description: 'From other stem' },
            { id: 'strings', name: 'Strings', icon: 'fas fa-violin', description: 'From other stem' },
            { id: 'keys', name: 'Keys', icon: 'fas fa-keyboard', description: 'From other stem' },
            { id: 'background', name: 'Background Vocals', icon: 'fas fa-users', description: 'From vocals stem' },
            { id: 'other', name: 'Other', icon: 'fas fa-compact-disc', description: 'Everything else' }
        ];

        const ttsModels = [
            { id: 'tts_models/en/ljspeech/tacotron2-DDC', name: 'Tacotron2-DDC', description: 'High quality English' },
            { id: 'tts_models/en/ljspeech/glow-tts', name: 'Glow-TTS', description: 'Fast synthesis' },
            { id: 'tts_models/en/ljspeech/speedy-speech', name: 'Speedy Speech', description: 'Very fast' },
            { id: 'tts_models/en/vctk/vits', name: 'VITS Multi-Speaker', description: 'Multiple voices' },
            { id: 'tts_models/multilingual/multi-dataset/xtts_v2', name: 'XTTS v2', description: 'Multi-language' }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('separator');
            const [selectedFile, setSelectedFile] = useState(null);
            const [selectedInstruments, setSelectedInstruments] = useState(['vocals', 'drums', 'bass', 'other']);
            const [currentJobId, setCurrentJobId] = useState(null);
            const [downloadData, setDownloadData] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [processingStatus, setProcessingStatus] = useState('');
            const [error, setError] = useState('');
            
            // YouTube states
            const [youtubeUrl, setYoutubeUrl] = useState('');
            const [youtubeJobId, setYoutubeJobId] = useState(null);
            const [youtubeStatus, setYoutubeStatus] = useState('');
            const [youtubeError, setYoutubeError] = useState('');
            
            // TTS states
            const [ttsText, setTtsText] = useState('');
            const [selectedTtsModel, setSelectedTtsModel] = useState('tts_models/en/ljspeech/tacotron2-DDC');
            const [ttsLanguage, setTtsLanguage] = useState('en');
            const [ttsJobId, setTtsJobId] = useState(null);
            const [ttsStatus, setTtsStatus] = useState('');
            const [ttsError, setTtsError] = useState('');
            const [ttsFilename, setTtsFilename] = useState('');

            const toggleInstrument = (instrumentId) => {
                setSelectedInstruments(prev => 
                    prev.includes(instrumentId) 
                        ? prev.filter(id => id !== instrumentId)
                        : [...prev, instrumentId]
                );
            };

            const handleFileSelect = (event) => {
                const file = event.target.files[0];
                if (file) {
                    setSelectedFile(file);
                    setError('');
                }
            };

            const separate_audio = async () => {
                if (!selectedFile) {
                    setError('Please select a file');
                    return;
                }

                setIsProcessing(true);
                setProcessingStatus('Uploading file...');
                setError('');

                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('instruments', selectedInstruments.join(','));

                try {
                    const response = await fetch('http://localhost:8000/api/separate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setCurrentJobId(result.job_id);
                    setProcessingStatus('Processing audio... This may take a few minutes.');
                    
                    // Start polling for status
                    pollStatus(result.job_id);
                } catch (err) {
                    setError(`Processing failed: ${err.message}`);
                    setIsProcessing(false);
                    setProcessingStatus('');
                }
            };

            const pollStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setDownloadData(status.stems);
                            setIsProcessing(false);
                            setProcessingStatus('');
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setError(`Processing failed: ${status.error}`);
                            setIsProcessing(false);
                            setProcessingStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setError(`Failed to check status: ${err.message}`);
                        setIsProcessing(false);
                        setProcessingStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const convert_youtube = async () => {
                if (!youtubeUrl.trim()) {
                    setYoutubeError('Please enter a YouTube URL');
                    return;
                }

                setYoutubeStatus('Converting YouTube video...');
                setYoutubeError('');

                try {
                    const response = await fetch('http://localhost:8000/api/youtube/convert', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ url: youtubeUrl })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setYoutubeJobId(result.job_id);
                    setYoutubeStatus('Converting... This may take a few minutes.');
                    
                    // Start polling for YouTube status
                    pollYoutubeStatus(result.job_id);
                } catch (err) {
                    setYoutubeError(`Conversion failed: ${err.message}`);
                    setYoutubeStatus('');
                }
            };

            const pollYoutubeStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setYoutubeStatus('Conversion completed!');
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setYoutubeError(`Conversion failed: ${status.error}`);
                            setYoutubeStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setYoutubeError(`Failed to check conversion status: ${err.message}`);
                        setYoutubeStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            const generate_tts = async () => {
                if (!ttsText.trim()) {
                    setTtsError('Please enter text to convert');
                    return;
                }

                setTtsStatus('Generating speech...');
                setTtsError('');

                const formData = new FormData();
                formData.append('text', ttsText);
                formData.append('model_name', selectedTtsModel);
                formData.append('language', ttsLanguage);

                try {
                    const response = await fetch('http://localhost:8000/api/tts/generate', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    setTtsJobId(result.job_id);
                    setTtsStatus('Generating... This may take a few minutes.');
                    
                    // Start polling for TTS status
                    pollTtsStatus(result.job_id);
                } catch (err) {
                    setTtsError(`Generation failed: ${err.message}`);
                    setTtsStatus('');
                }
            };

            const pollTtsStatus = async (jobId) => {
                const pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch(`http://localhost:8000/api/status/${jobId}`);
                        const status = await response.json();
                        
                        if (status.status === 'completed') {
                            setTtsStatus('Generation completed!');
                            setTtsFilename(status.filename);
                            clearInterval(pollInterval);
                        } else if (status.status === 'failed') {
                            setTtsError(`Generation failed: ${status.error}`);
                            setTtsStatus('');
                            clearInterval(pollInterval);
                        }
                    } catch (err) {
                        setTtsError(`Failed to check generation status: ${err.message}`);
                        setTtsStatus('');
                        clearInterval(pollInterval);
                    }
                }, 2000);
            };

            return (
                <div className="min-h-screen py-8 px-4">
                    <div className="max-w-6xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-12">
                            <div className="liquid-glass-card rounded-3xl p-8 mb-6">
                                <i className="fas fa-music text-6xl text-white floating pulse-glow mb-6"></i>
                                <h1 className="text-4xl font-semibold text-white mb-2">
                                    AISim Tools
                                </h1>
                                <p className="text-white/80 text-lg">
                                    Professional audio separation, YouTube conversion, and text-to-speech tools
                                </p>
                            </div>
                        </div>

                        {/* Tab Navigation */}
                        <div className="liquid-glass-card rounded-3xl p-2 mb-8">
                            <div className="flex space-x-2">
                                <button
                                    onClick={() => setActiveTab('separator')}
                                    className={`flex-1 py-3 px-6 rounded-2xl font-semibold text-white transition-all duration-300 ${
                                        activeTab === 'separator' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-waveform-lines mr-2"></i>
                                    Stem Separator
                                </button>
                                <button
                                    onClick={() => setActiveTab('youtube')}
                                    className={`flex-1 py-3 px-6 rounded-2xl font-semibold text-white transition-all duration-300 ${
                                        activeTab === 'youtube' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fab fa-youtube mr-2"></i>
                                    YouTube Converter
                                </button>
                                <button
                                    onClick={() => setActiveTab('tts')}
                                    className={`flex-1 py-3 px-6 rounded-2xl font-semibold text-white transition-all duration-300 ${
                                        activeTab === 'tts' ? 'tab-active' : 'tab-inactive'
                                    }`}
                                >
                                    <i className="fas fa-microphone-alt mr-2"></i>
                                    Text-to-Speech
                                </button>
                            </div>
                        </div>

                        {/* Tab Content */}
                        {activeTab === 'separator' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-waveform-lines mr-3"></i>
                                    AI Stem Separator
                                </h2>
                                
                                {/* File Upload */}
                                <div className="mb-8">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-upload mr-2"></i>
                                        Upload Audio File
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="file"
                                            onChange={handleFileSelect}
                                            accept="audio/*"
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        />
                                        {selectedFile && (
                                            <div className="mt-2 text-white/80">
                                                <i className="fas fa-check-circle mr-2 text-green-400"></i>
                                                Selected: {selectedFile.name}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Instrument Selection */}
                                <div className="mb-8">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-sliders-h mr-2"></i>
                                        Select Instruments to Separate
                                    </label>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        {instruments.map(instrument => (
                                            <button
                                                key={instrument.id}
                                                onClick={() => toggleInstrument(instrument.id)}
                                                className={`liquid-glass-card p-4 rounded-xl text-center transition-all duration-200 
                                                    ${
                                                        selectedInstruments.includes(instrument.id) 
                                                            ? 'ring-2 ring-white/50 bg-white/20' 
                                                            : ''
                                                    }`}
                                            >
                                                <i className={`${instrument.icon} instrument-icon text-white block mx-auto mb-2`}></i>
                                                <div className="text-white text-sm font-medium">{instrument.name}</div>
                                                <div className="text-white/60 text-xs">{instrument.description}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Process Button */}
                                <div className="mb-8">
                                    <button
                                        onClick={separate_audio}
                                        disabled={isProcessing || !selectedFile}
                                        className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {isProcessing ? (
                                            <>
                                                <i className="fas fa-spinner fa-spin mr-3"></i>
                                                {processingStatus}
                                            </>
                                        ) : (
                                            <>
                                                <i className="fas fa-magic mr-3"></i>
                                                Separate Audio
                                            </>
                                        )}
                                    </button>
                                </div>

                                {/* Error Display */}
                                {error && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{error}</p>
                                    </div>
                                )}

                                {/* Download Section */}
                                {downloadData && (
                                    <div className="space-y-4">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Separated Stems
                                        </h3>
                                        <div className="grid gap-4">
                                            {Object.entries(downloadData).map(([stemName, stemInfo]) => (
                                                <div key={stemName} className="liquid-glass-card p-6 rounded-xl">
                                                    <div className="flex items-center justify-between mb-4">
                                                        <div className="flex items-center">
                                                            <i className={`${instruments.find(i => i.id === stemName)?.icon || 'fas fa-music'} stem-icon text-white mr-3`}></i>
                                                            <h3 className="text-white font-semibold">
                                                                {instruments.find(i => i.id === stemName)?.name || stemName.charAt(0).toUpperCase() + stemName.slice(1)}
                                                            </h3>
                                                        </div>
                                                        <span className="text-white/70 text-sm bg-white/20 rounded-full px-3 py-1">
                                                            {(stemInfo.size / 1024 / 1024).toFixed(2)} MB
                                                        </span>
                                                    </div>
                                                    <a 
                                                        href={`http://localhost:8000/api/download/${currentJobId}/${stemName}`} 
                                                        download={`${selectedFile.name.replace(/\.[^/.]+$/, '')}_${stemName}.wav`}
                                                        className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                                    >
                                                        <i className="fas fa-download mr-2"></i> Download
                                                    </a>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'youtube' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fab fa-youtube mr-3"></i>
                                    YouTube to WAV Converter
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-link mr-2"></i>
                                        YouTube URL
                                    </label>
                                    <input
                                        type="url"
                                        value={youtubeUrl}
                                        onChange={(e) => setYoutubeUrl(e.target.value)}
                                        placeholder="https://www.youtube.com/watch?v=..."
                                        className="w-full p-4 liquid-glass-input rounded-xl"
                                    />
                                </div>

                                <button
                                    onClick={convert_youtube}
                                    disabled={!youtubeUrl.trim() || youtubeStatus.includes('Converting')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {youtubeStatus.includes('Converting') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {youtubeStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fab fa-youtube mr-3"></i>
                                            Convert to WAV
                                        </>
                                    )}
                                </button>

                                {youtubeError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{youtubeError}</p>
                                    </div>
                                )}

                                {youtubeStatus.includes('completed') && youtubeJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Converted Audio
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/youtube/download/${youtubeJobId}`} 
                                            download
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download WAV
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'tts' && (
                            <div className="liquid-glass-card rounded-3xl p-8">
                                <h2 className="text-2xl font-semibold text-white mb-6">
                                    <i className="fas fa-microphone-alt mr-3"></i>
                                    Text-to-Speech Generator
                                </h2>
                                
                                <div className="mb-6">
                                    <label className="block text-white font-medium mb-4">
                                        <i className="fas fa-font mr-2"></i>
                                        Text to Convert
                                    </label>
                                    <textarea
                                        value={ttsText}
                                        onChange={(e) => setTtsText(e.target.value)}
                                        placeholder="Enter the text you want to convert to speech..."
                                        className="w-full p-4 liquid-glass-input rounded-xl h-32 resize-none"
                                    />
                                </div>

                                <div className="grid md:grid-cols-2 gap-6 mb-6">
                                    <div>
                                        <label className="block text-white font-medium mb-4">
                                            <i className="fas fa-robot mr-2"></i>
                                            Voice Model
                                        </label>
                                        <select
                                            value={selectedTtsModel}
                                            onChange={(e) => setSelectedTtsModel(e.target.value)}
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        >
                                            {ttsModels.map(model => (
                                                <option key={model.id} value={model.id} className="bg-gray-800 text-white">
                                                    {model.name} - {model.description}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-white font-medium mb-4">
                                            <i className="fas fa-globe mr-2"></i>
                                            Language
                                        </label>
                                        <select
                                            value={ttsLanguage}
                                            onChange={(e) => setTtsLanguage(e.target.value)}
                                            className="w-full p-4 liquid-glass-input rounded-xl"
                                        >
                                            <option value="en" className="bg-gray-800 text-white">English</option>
                                            <option value="es" className="bg-gray-800 text-white">Spanish</option>
                                            <option value="fr" className="bg-gray-800 text-white">French</option>
                                            <option value="de" className="bg-gray-800 text-white">German</option>
                                            <option value="it" className="bg-gray-800 text-white">Italian</option>
                                            <option value="pt" className="bg-gray-800 text-white">Portuguese</option>
                                            <option value="pl" className="bg-gray-800 text-white">Polish</option>
                                            <option value="tr" className="bg-gray-800 text-white">Turkish</option>
                                            <option value="ru" className="bg-gray-800 text-white">Russian</option>
                                            <option value="nl" className="bg-gray-800 text-white">Dutch</option>
                                            <option value="cs" className="bg-gray-800 text-white">Czech</option>
                                            <option value="ar" className="bg-gray-800 text-white">Arabic</option>
                                            <option value="zh-cn" className="bg-gray-800 text-white">Chinese (Simplified)</option>
                                            <option value="ja" className="bg-gray-800 text-white">Japanese</option>
                                            <option value="hu" className="bg-gray-800 text-white">Hungarian</option>
                                            <option value="ko" className="bg-gray-800 text-white">Korean</option>
                                        </select>
                                    </div>
                                </div>

                                <button
                                    onClick={generate_tts}
                                    disabled={!ttsText.trim() || ttsStatus.includes('Generating')}
                                    className="w-full liquid-glass-button text-white py-4 px-6 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed mb-6"
                                >
                                    {ttsStatus.includes('Generating') ? (
                                        <>
                                            <i className="fas fa-spinner fa-spin mr-3"></i>
                                            {ttsStatus}
                                        </>
                                    ) : (
                                        <>
                                            <i className="fas fa-microphone-alt mr-3"></i>
                                            Generate Speech
                                        </>
                                    )}
                                </button>

                                {ttsError && (
                                    <div className="mb-6 p-4 bg-red-500/20 border border-red-500/30 rounded-xl">
                                        <p className="text-red-200">{ttsError}</p>
                                    </div>
                                )}

                                {ttsStatus.includes('completed') && ttsJobId && (
                                    <div className="liquid-glass-card p-6 rounded-xl">
                                        <h3 className="text-xl font-semibold text-white mb-4">
                                            <i className="fas fa-download mr-2"></i>
                                            Download Generated Speech
                                        </h3>
                                        <a 
                                            href={`http://localhost:8000/api/tts/download/${ttsJobId}`} 
                                            download={ttsFilename}
                                            className="w-full liquid-glass-button text-white py-3 px-4 rounded-xl font-bold hover:scale-105 transition-all duration-300 flex items-center justify-center"
                                        >
                                            <i className="fas fa-download mr-2"></i> Download Audio
                                        </a>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
